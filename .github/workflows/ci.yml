name: CI - Build Validation

# Se ejecuta en cada Pull Request hacia develop o main,
# y también en cada push directo a esas ramas (por seguridad).
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (build)
        run: npm run build

  build-backend:
    name: Build Backend (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar que el proyecto compila / arranca sin errores
        run: |
          node --check src/server.js